name: clipnote
description: Local-first clipboard manager and notes app. No cloud, no tracking.
version: 1.0.0+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Database
  isar_community: ^3.3.0
  isar_community_flutter_libs: ^3.3.0
  path_provider: ^2.1.3

  # UI & Markdown
  intl: ^0.20.2
  flutter_markdown: ^0.6.22

  # Utils - export & share
  share_plus: ^9.0.0
  url_launcher: ^6.3.1
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  flutter_timezone: ^4.1.1
  in_app_purchase: ^3.2.0
  google_mobile_ads: ^5.1.0
  file_picker: ^8.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  isar_community_generator: ^3.3.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/clipnote_app_icon.png"
  adaptive_icon_background: "#100E1A"
  adaptive_icon_foreground: "assets/icons/clipnote_app_icon.png"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/fonts/
